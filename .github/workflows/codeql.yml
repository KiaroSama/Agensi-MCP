name: CodeQL
on:
  workflow_call:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize project-owned analysis scratch
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:GITHUB_WORKSPACE '.tmp'
          New-Item $tempRoot -ItemType Directory -Force | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) { "$name=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          "CARGO_HOME=$env:GITHUB_WORKSPACE/.cache/cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE/.cache/codeql-target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
