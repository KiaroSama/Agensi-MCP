name: CI
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Empty = internal validation; vX.Y.Z = verified private-signed release on main'
        required: false
        type: string
permissions:
  contents: read
jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate approved public signing contract and release ref
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:REQUESTED_TAG -and ($env:GITHUB_REF -cnotin @('refs/heads/main','refs/heads/fix/private-signed-release') -or $env:GITHUB_REPOSITORY -cne 'KiaroSama/Agensi-MCP' -or $env:GITHUB_ACTOR -cne 'KiaroSama')) { throw 'Private release signing is restricted to the verified owner and reviewed release branch.' }
          . ./scripts/signing-common.ps1
          Get-SigningDescriptor | Out-Null
      - name: Require encrypted signing inputs for a release
        if: inputs.release_tag != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/private-signed-release') && github.repository == 'KiaroSama/Agensi-MCP' && github.actor == 'KiaroSama'
        env:
          AGENSI_SIGNING_PFX_B64: ${{ secrets.AGENSI_SIGNING_PFX_B64 }}
          AGENSI_SIGNING_PASSWORD: ${{ secrets.AGENSI_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          & ./scripts/sign-release.ps1 -Path ./target/release/agensi-mcp -Preflight
  dependencies:
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  native:
    needs: [release-readiness]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 0
      AGENSI_SOURCE_COMMIT: ${{ github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize project-owned child scratch
        run: |
          $tempRoot = Join-Path $env:GITHUB_WORKSPACE '.tmp'
          New-Item $tempRoot -ItemType Directory -Force | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) { "$name=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
      - name: Verify stable toolchain
        run: |
          rustc --version
          cargo --version
          $hostTarget = (& rustc -vV | Select-String '^host: ').Line.Substring(6)
          if ($hostTarget -ne '${{ matrix.target }}') { throw "Unexpected runner architecture: $hostTarget" }
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Formatting
        id: formatting
        continue-on-error: true
        run: cargo +1.99.0 fmt --all --check
      - name: Bootstrap native check tool
        timeout-minutes: 20
        run: |
          cargo +1.99.0 build --locked --bin check-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select native check tool
        run: |
          New-Item .tmp -ItemType Directory -Force | Out-Null
          $name = if ($IsWindows) { 'check-run.exe' } else { 'check-run' }
          Copy-Item "target/debug/$name" ".tmp/$name"
          "CHECK_RUN=./.tmp/$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate package and requested release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '& $env:CHECK_RUN --wall 30 --idle 15 -- $env:CHECK_RUN release'
      - name: Static checks
        run: '& $env:CHECK_RUN --wall 600 --idle 120 -- cargo +1.99.0 clippy --locked --all-targets -- -D warnings'
      - name: Build native executable and test targets
        id: build_native
        run: '& $env:CHECK_RUN --wall 600 --idle 120 -- cargo +1.99.0 build --locked --all-targets'
      - name: Prepare Windows launcher executable
        if: runner.os == 'Windows'
        run: |
          New-Item bin -ItemType Directory -Force | Out-Null
          Copy-Item target/debug/agensi-mcp.exe bin/agensi-mcp.exe
      - name: Prepare Unix launcher executable
        if: runner.os != 'Windows'
        run: |
          New-Item bin -ItemType Directory -Force | Out-Null
          Copy-Item target/debug/agensi-mcp bin/agensi-mcp
          chmod +x bin/agensi-mcp
          bash run.sh status
      - name: Verify owned runner on the native platform
        run: '& $env:CHECK_RUN --wall 90 --idle 20 -- cargo +1.99.0 test --locked --test check_runner'
      - name: Runner output-consumer pressure regressions
        run: pwsh -NoProfile -File scripts/test-output-pressure.ps1
      - name: Windows menu exit and redirected input contracts
        if: runner.os == 'Windows'
        run: '& $env:CHECK_RUN --wall 90 --idle 20 -- cargo +1.99.0 test --locked --test menu'
      - name: Isolated registration upgrade and preservation tests
        if: runner.os == 'Windows'
        run: |
          & $env:CHECK_RUN --wall 90 --idle 20 -- pwsh -NoProfile -File scripts/test-registration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CHECK_RUN --wall 90 --idle 20 -- pwsh -NoProfile -File scripts/test-registration-storage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native parity, protocol, proxies, OAuth, TLS and entry tests
        id: native_tests
        run: |
          New-Item .tmp -ItemType Directory -Force | Out-Null
          $names = @('management','network','auth','tls','protocol','oauth_flow','entry','socks4_userid','local_http','settings','diagnostics','cleanup','audit_regressions','check_release','operator')
          $metadata = & cargo +1.99.0 metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = @($metadata.packages | Where-Object name -eq 'agensi-mcp' | ForEach-Object targets | Where-Object { $_.kind -contains 'test' } | ForEach-Object name)
          $mapped = $names + @('check_runner','menu','audit_blackbox')
          if (Compare-Object ($actual | Sort-Object) ($mapped | Sort-Object)) { throw 'CI test-target mapping is incomplete.' }
          $testArgs = @('+1.99.0','test','--locked','--lib','--bin','agensi-mcp','--bin','check-run')
          foreach ($name in $names) { $testArgs += @('--test',$name) }
          $testArgs += @('--','--test-threads=2')
          & $env:CHECK_RUN --wall 180 --idle 45 -- cargo @testArgs 2>&1 | Tee-Object -FilePath .tmp/ci-native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Documentation tests
        run: '& $env:CHECK_RUN --wall 60 --idle 30 -- cargo +1.99.0 test --locked --doc'
      - name: Black-box OAuth, revocation, filesystem and management regressions
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: '& $env:CHECK_RUN --wall 120 --idle 20 -- cargo +1.99.0 test --locked --test audit_blackbox -- --source-root . --output .tmp/audit-results.json'
      - name: Dedicated HTTPS proxy and custom-CA controls on each native platform
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        timeout-minutes: 5
        run: pwsh -NoProfile -File scripts/test-tls-proxy-ci.ps1
      - name: Retain sanitized HTTPS proxy results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-proxy-regressions-${{ matrix.platform }}
          include-hidden-files: true
          path: |
            .tmp/tls-proxy-results.json
            .tmp/tls-ci-*/cleanup.json
            .tmp/tls-ci-*/*.log
            .tmp/tls-ci-*/*.diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Retain sanitized black-box results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-regressions-linux
          path: .tmp/audit-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Public package and sensitive-pattern check
        run: pwsh -NoProfile -File scripts/check-publication.ps1
      - name: Enforce formatting result
        if: always() && steps.formatting.outcome != 'success'
        run: exit 1
      - name: Build optimized downloadable executable
        id: optimized_build
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        run: '& $env:CHECK_RUN --wall 900 --idle 180 -- cargo +1.99.0 build --locked --release --bin agensi-mcp'
      - name: Native-sign and verify final executable
        id: signing
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' && steps.optimized_build.outcome == 'success' && inputs.release_tag != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/private-signed-release') && github.repository == 'KiaroSama/Agensi-MCP' && github.actor == 'KiaroSama' }}
        env:
          AGENSI_SIGNING_PFX_B64: ${{ secrets.AGENSI_SIGNING_PFX_B64 }}
          AGENSI_SIGNING_PASSWORD: ${{ secrets.AGENSI_SIGNING_PASSWORD }}
        run: |
          $name = if ($IsWindows) { 'agensi-mcp.exe' } else { 'agensi-mcp' }
          $version = '${{ inputs.release_tag }}'.Substring(1)
          & $env:CHECK_RUN --wall 120 --idle 30 -- pwsh -NoProfile -File scripts/sign-release.ps1 -Path "target/release/$name" -Platform '${{ matrix.platform }}' -SourceCommit $env:GITHUB_SHA -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CHECK_RUN --wall 120 --idle 30 -- pwsh -NoProfile -File scripts/test-signing.ps1 -Path "target/release/$name" -Platform '${{ matrix.platform }}' -SourceCommit $env:GITHUB_SHA -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify private-signed extracted download
        id: package
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' && steps.signing.outcome == 'success' && inputs.release_tag != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/private-signed-release') && github.repository == 'KiaroSama/Agensi-MCP' && github.actor == 'KiaroSama' }}
        env:
          AGENSI_SIGNING_PFX_B64: ${{ secrets.AGENSI_SIGNING_PFX_B64 }}
          AGENSI_SIGNING_PASSWORD: ${{ secrets.AGENSI_SIGNING_PASSWORD }}
        run: '& $env:CHECK_RUN --wall 180 --idle 45 -- pwsh -NoProfile -File scripts/package-release.ps1 -Platform ''${{ matrix.platform }}'''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.package.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        with:
          name: agensi-mcp-${{ matrix.platform }}
          path: |
            dist/agensi-mcp-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30
      - name: Collect Linux validation evidence
        if: always() && runner.os == 'Linux'
        run: pwsh -NoProfile -File scripts/collect-ci-evidence.ps1
      - name: Retain Linux validation evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-validation-evidence
          path: .tmp/ci-review/
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    needs: [release-readiness, native, dependencies, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agensi-mcp-*
          merge-multiple: true
          path: dist
      - name: Verify signed archive and checksum bytes
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz|sha256)$' }) {
            & ./scripts/verify-release.ps1 -Path $file.FullName
          }
          if (@(Get-ChildItem dist -Filter '*.sig').Count -ne 8) { throw 'Expected signatures for all four archives and checksum files.' }
      - name: Verify checksums and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a new vX.Y.Z tag'; exit 1; }
          cd dist
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          sha256sum -c ./*.sha256
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Agensi MCP $RELEASE_TAG" \
            --notes "CI-built Rust binaries for Windows x64, Linux x64, macOS Apple Silicon and Intel. Publisher KiaroSama; genuine private self-signed Authenticode/macOS codesign and pinned RSA-SHA256 detached signatures. Not public-CA trusted, Apple-notarized or trusted-timestamped; OS warnings may remain. Verify the public pins and signatures before execution. Extract the archive; no Rust or Node build is required. SHA256 files and exact source commit are included. Runtime defaults disconnected; bring your own proxy and sign-in." \
            ./*.zip ./*.tar.gz ./*.sha256 ./*.sig
