[package]
name = "agensi-mcp"
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Fail-closed Agensi MCP bridge and local connection manager"

[lib]
path = "native/src/lib.rs"

[[bin]]
name = "agensi-mcp"
path = "native/src/main.rs"

[[test]]
name = "management"
path = "native/tests/management.rs"

[[test]]
name = "network"
path = "native/tests/network.rs"

[[test]]
name = "auth"
path = "native/tests/auth.rs"

[[test]]
name = "tls"
path = "native/tests/tls.rs"

[[test]]
name = "protocol"
path = "native/tests/protocol.rs"

[[test]]
name = "oauth_flow"
path = "native/tests/oauth_flow.rs"

[[test]]
name = "entry"
path = "native/tests/entry.rs"

[[test]]
name = "socks4_userid"
path = "native/tests/socks4_userid.rs"

[[test]]
name = "local_http"
path = "native/tests/local_http.rs"

[[test]]
name = "settings"
path = "native/tests/settings.rs"

[dev-dependencies]
rcgen = "=0.14.10"
tokio-rustls = "=0.26.6"

[dependencies]
axum = "=0.8.9"
tokio-util = "=0.7.20"
anyhow = "=1.0.104"
async-trait = "=0.1.92"
chrono = "=0.4.45"
fs2 = "=0.4.3"
futures = "=0.3.34"
http = "=1.5.0"
md5 = "=0.8.1"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "socks", "json", "stream", "form"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "auth", "reqwest", "transport-io", "transport-streamable-http-client-reqwest"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
subtle = "=2.6.1"
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["full"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4"] }
tokio-socks = "=0.5.3"
fast-socks5 = "=1.0.0"
log = "=0.4.34"
